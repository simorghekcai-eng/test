name: Download xformers wheel

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download xformers wheel
        run: |
          mkdir -p wheels
          curl -L --fail --retry 5 --retry-delay 10 \
            -o "wheels/xformers-0.0.33+5d4b92a5.d20251029-cp39-abi3-linux_x86_64.whl" \
            "https://download.pytorch.org/whl/cu128/xformers-0.0.33%2B5d4b92a5.d20251029-cp39-abi3-linux_x86_64.whl"

      - name: Verify download
        run: |
          ls -lh wheels/
          file wheels/*.whl

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: xformers-wheel
          path: wheels/*.whl
          retention-days: 7
          compression-level: 0
